plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
def dartEnvironmentVariables = [];
if (project.hasProperty('dart-defines')) {
    dartEnvironmentVariables = project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
                [(pair.first()): pair.last()]
            }
}

android {
    namespace = "app.example.shop"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            res.srcDirs = ['src/main/res']
        }
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId dartEnvironmentVariables.bundleIdAndroid
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue "string", "deep_link", dartEnvironmentVariables.deepLink ?: "com.example1.app"
        resValue "string", "deep_link_scheme", dartEnvironmentVariables.deep_link_scheme ?: "com.example1.app"
        resValue "string", "app_name", dartEnvironmentVariables.applicationName ?: "com.example1.app"
    }
    signingConfigs {
        release {
//            keyAlias dartEnvironmentVariables.envKeyAlias
//            keyPassword dartEnvironmentVariables.envKeyPassword
//            storeFile dartEnvironmentVariables.envStoreFile ? file(dartEnvironmentVariables.envStoreFile) : null
//            storePassword dartEnvironmentVariables.envStorePassword
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

task selectGoogleServicesJson(type: Copy) {
    from "firebase/${dartEnvironmentVariables.mainName}/google-services.json"
    into './'
}


flutter {
    source = "../.."
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:16.0.1'
}
